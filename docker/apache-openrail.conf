# openrail virtual host - installed as sites-available/000-default.conf.
#
# This must be a full <VirtualHost>, not a conf-enabled snippet: mod_rewrite
# rules placed in server scope are NOT inherited into a vhost, and the default
# Debian DocumentRoot (/var/www/html) is wrong for us.

<VirtualHost *:80>
    ServerName openrail

    # livesig.cgi reads $DOCUMENT_ROOT/auxy/livesigN.svg, and the CGIs link
    # their CSS/JS as /auxy/...  -> DocumentRoot must be /var/www.
    DocumentRoot /var/www

    <Directory /var/www>
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # CGI programs.
    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory /usr/lib/cgi-bin>
        Require all granted
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch -Indexes
    </Directory>

    # Pretty /rail/* URLs -> CGI, trailing path handed over in the PARMS env var
    # (livesig.cgi / ops.cgi read PARMS; liverail / livetrain / railquery read
    # REQUEST_URI, which [PT] leaves as the original /rail/... path).
    RewriteEngine On
    RewriteRule  ^/rail/liverail(.*)$   /cgi-bin/liverail.cgi    [E=PARMS:$1,PT,L]
    RewriteRule  ^/rail/livetrain(.*)$  /cgi-bin/livetrain.cgi   [E=PARMS:$1,PT,L]
    RewriteRule  ^/rail/query(.*)$      /cgi-bin/railquery.cgi   [E=PARMS:$1,PT,L]
    RewriteRule  ^/rail/livesig(.*)$    /cgi-bin/livesig.cgi     [E=PARMS:$1,PT,L]
    RewriteRule  ^/rail/ops(.*)$        /cgi-bin/ops.cgi         [E=PARMS:$1,PT,L]

    # Bare hostname -> the live departure board index.
    RedirectMatch ^/$ /rail/liverail/

    ErrorLog  /var/log/garner/web/error.log
    CustomLog /var/log/garner/web/access.log combined
</VirtualHost>

# ops.cgi (operator control panel) is NOT protected here - keep the web port off
# the public internet, or add auth, e.g. inside the vhost:
#
#   <Location /rail/ops>
#       AuthType Basic
#       AuthName "openrail ops"
#       AuthUserFile /etc/apache2/.htpasswd
#       Require valid-user
#   </Location>
