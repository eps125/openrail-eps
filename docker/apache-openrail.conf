# openrail CGI front-end - ported from the repo's Apache-setup.txt.
#
# Debian's serve-cgi-bin.conf already exposes /usr/lib/cgi-bin via
# "ScriptAlias /cgi-bin/", so the rewrites below just map the pretty
# /rail/* URLs onto the CGI programs and pass the trailing path in the
# PARMS environment variable (livesig.cgi and ops.cgi read PARMS;
# liverail/livetrain/railquery read REQUEST_URI, which [PT] leaves intact).

RewriteEngine On

RewriteRule  ^/rail/liverail(.*)$   /cgi-bin/liverail.cgi    [E=PARMS:$1,PT,L]
RewriteRule  ^/rail/livetrain(.*)$  /cgi-bin/livetrain.cgi   [E=PARMS:$1,PT,L]
RewriteRule  ^/rail/query(.*)$      /cgi-bin/railquery.cgi   [E=PARMS:$1,PT,L]
RewriteRule  ^/rail/livesig(.*)$    /cgi-bin/livesig.cgi     [E=PARMS:$1,PT,L]
RewriteRule  ^/rail/ops(.*)$        /cgi-bin/ops.cgi         [E=PARMS:$1,PT,L]

# Bare hostname -> the live departure board.
RedirectMatch ^/$ /rail/liverail

# Static assets (livesig*.svg, *.css, *.js).  livesig.cgi reads
# $DOCUMENT_ROOT/auxy/livesigN.svg, so DocumentRoot must stay /var/www.
<Directory /var/www/auxy>
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# ops.cgi is the operator control panel.  It is NOT protected here - add HTTP
# auth or keep the container off the public internet.  Example:
#
# <Location /rail/ops>
#     AuthType Basic
#     AuthName "openrail ops"
#     AuthUserFile /etc/apache2/.htpasswd
#     Require valid-user
# </Location>
