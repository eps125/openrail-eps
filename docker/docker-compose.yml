# openrail stack.
#
# This file pulls a prebuilt image from GHCR - deploy it straight from Portainer
# (Stacks -> Add stack -> Repository, compose path docker/docker-compose.yml) and
# set the variables from .env.example in the stack's Environment variables panel.
#
# To build the image locally instead of pulling, add the build override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# First-run bootstrap (loads reference data + timetable), run once:
#   docker compose --profile init run --rm init

version: "3.8"

# Image used by every app container.  The GitHub Actions workflow publishes
# ghcr.io/<owner>/<repo>; override OPENRAIL_IMAGE if you deployed your own fork.
x-openrail-image: &openrail-image "${OPENRAIL_IMAGE:-ghcr.io/eps125/openrail-eps:latest}"

# Environment shared by every app container.
x-openrail-env: &openrail-env
  DB_SERVER: db
  DB_NAME: "${DB_NAME:-rail}"
  DB_USER: "${DB_USER:-rail}"
  DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
  NR_USER: "${NR_USER:-}"
  NR_PASSWORD: "${NR_PASSWORD:-}"
  NR_SERVER: "${NR_SERVER:-datafeeds.networkrail.co.uk}"
  NR_STOMP_PORT: "${NR_STOMP_PORT:-}"
  PUBLIC_URL: "${PUBLIC_URL:-}"
  REPORT_EMAIL: "${REPORT_EMAIL:-}"
  STOMP_TOPICS: "${STOMP_TOPICS:-VSTP_ALL;TRAIN_MVT_ALL_TOC;TD_ALL_SIG_AREA}"
  STOMP_TOPIC_NAMES: "${STOMP_TOPIC_NAMES:-VSTP;TRUST;TD}"
  STOMP_TOPIC_LOG: "${STOMP_TOPIC_LOG:-false;false;false;false}"
  INIT_FETCH_TIMETABLE: "${INIT_FETCH_TIMETABLE:-yes}"
  TRUSTDB_NO_DEDUCE_ACT: "${TRUSTDB_NO_DEDUCE_ACT:-}"
  LIVE_SERVER: "${LIVE_SERVER:-}"
  OPENRAIL_DEBUG: "${OPENRAIL_DEBUG:-}"
  TZ: "${TZ:-Europe/London}"
  # RDM "NWR Passenger Train Allocation and Consist" Kafka feed (allocation service).
  RDM_KAFKA_BOOTSTRAP: "${RDM_KAFKA_BOOTSTRAP:-}"
  RDM_KAFKA_TOPIC: "${RDM_KAFKA_TOPIC:-}"
  RDM_KAFKA_GROUP: "${RDM_KAFKA_GROUP:-}"
  RDM_KAFKA_USER: "${RDM_KAFKA_USER:-}"
  RDM_KAFKA_PASSWORD: "${RDM_KAFKA_PASSWORD:-}"
  RDM_KAFKA_OFFSET_RESET: "${RDM_KAFKA_OFFSET_RESET:-latest}"
  ALLOCATION_KEEP_DAYS: "${ALLOCATION_KEEP_DAYS:-21}"

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    # Tuning is passed as flags (not a mounted my.cnf) so a Portainer git stack
    # can't drop the file.  Rationale for the values is in docker/my.cnf.
    # Sized for a VM with >= ~6 GB RAM free for the DB.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --skip-name-resolve
      - --max-connections=300
      - --max-allowed-packet=256M
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-4G}
      - --innodb-log-buffer-size=128M
      - --innodb-log-file-size=1G
      - --innodb-buffer-pool-dump-at-shutdown=1
      - --innodb-buffer-pool-load-at-startup=1
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --innodb-file-per-table=1
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
      - --innodb-flush-neighbors=0
      - --innodb-read-io-threads=8
      - --innodb-write-io-threads=8
      - --innodb-purge-threads=4
      - --loose-innodb-snapshot-isolation=OFF
      - --query-cache-type=0
      - --query-cache-size=0
      - --table-open-cache=4000
      - --table-definition-cache=2000
      - --tmp-table-size=256M
      - --max-heap-table-size=256M
      - --join-buffer-size=8M
      - --sort-buffer-size=8M
      - --read-rnd-buffer-size=4M
    environment:
      MARIADB_DATABASE: "${DB_NAME:-rail}"
      MARIADB_USER: "${DB_USER:-rail}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}"
      TZ: "${TZ:-Europe/London}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Exposed so an external reader (e.g. railway-live-maps' garner bridge, on the
    # same host/LAN) can pull TRUST/VSTP/CIF/CORPUS/SMART data via a read-only user —
    # see README.md's "External read access" section for the GRANT to run instead of
    # handing out DB_USER/DB_PASSWORD. Same tradeoff as any other single-operator
    # stack publishing a DB port directly: fine behind a firewall/VPN, not on a raw
    # public IP. Leave commented out (default) if nothing external needs to read it.
    ports:
      - "${DB_PORT:-3306}:3306"

  collector:
    image: *openrail-image
    command: ["openrail-collector"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *openrail-env
    volumes:
      - logs:/var/log/garner
      - spool:/var/spool/stompy
    stop_grace_period: 40s

  web:
    image: *openrail-image
    command: ["openrail-web"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *openrail-env
    ports:
      # Change the host port with WEB_PORT (container port stays 80).
      - "${WEB_PORT:-8080}:80"
    volumes:
      - logs:/var/log/garner

  cron:
    image: *openrail-image
    command: ["openrail-cron"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *openrail-env
    volumes:
      - logs:/var/log/garner

  # Kafka consumer for the RDM "NWR Passenger Train Allocation and Consist" feed.
  # Populates train_allocation, shown by livetrain.cgi as the "Allocations" panel.
  # Requires RDM_KAFKA_* in the stack env; harmless to leave running unconfigured
  # (it exits and restarts until the vars are set).
  allocation:
    image: *openrail-image
    command: ["openrail-allocation"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *openrail-env
    volumes:
      - logs:/var/log/garner

  # One-shot bootstrap - only runs when explicitly selected:
  #   docker compose --profile init run --rm init
  init:
    image: *openrail-image
    command: ["openrail-init"]
    profiles: ["init"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *openrail-env
    volumes:
      - logs:/var/log/garner

  # One-shot: create/refresh a read-only user for an external reader (railway-live-maps' garner
  # bridge). Idempotent - re-run to rotate the password. Set RLM_BRIDGE_USER / RLM_BRIDGE_PASSWORD
  # in the stack env first, then:
  #   docker compose --profile grant-bridge-user run --rm grant-bridge-user
  # (See README.md "External read access". The reader still needs the db port published - DB_PORT.)
  grant-bridge-user:
    image: mariadb:11
    profiles: ["grant-bridge-user"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: "${DB_NAME:-rail}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}"
      RLM_BRIDGE_USER: "${RLM_BRIDGE_USER:-rlm_bridge}"
      RLM_BRIDGE_PASSWORD: "${RLM_BRIDGE_PASSWORD:?set RLM_BRIDGE_PASSWORD}"
    entrypoint: ["sh", "-c"]
    command:
      - |
        mariadb -h db -u root -p"$$DB_ROOT_PASSWORD" -e "
          CREATE USER IF NOT EXISTS '$$RLM_BRIDGE_USER'@'%' IDENTIFIED BY '$$RLM_BRIDGE_PASSWORD';
          ALTER USER '$$RLM_BRIDGE_USER'@'%' IDENTIFIED BY '$$RLM_BRIDGE_PASSWORD';
          GRANT SELECT ON \`$$DB_NAME\`.* TO '$$RLM_BRIDGE_USER'@'%';
          FLUSH PRIVILEGES;" &&
        echo "grant-bridge-user: '$$RLM_BRIDGE_USER' can now SELECT on $$DB_NAME"

volumes:
  db_data:
  logs:
  spool:
